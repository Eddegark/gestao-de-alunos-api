name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for MongoDB
        run: |
          npm install -g wait-for-it
          wait-for-it localhost:27017 --timeout=60

      - name: Run tests
        run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/gestao-de-alunos-test
          NODE_ENV: test

      - name: Run integration tests
        run: npm run test:integration
        env:
          MONGODB_URI: mongodb://localhost:27017/gestao-de-alunos-test
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            test/
            package.json
          retention-days: 7
